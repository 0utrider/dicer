# GitHub Actions workflow for Dicer releases (modelled on Animater's).
#
# On every push/PR to main it validates the manifest, lints, runs the unit tests and builds. On a
# published release it injects the release URLs into module.json, builds dist/, zips ONLY the files
# Foundry loads (module.json, dist/, styles/, lang/, templates/, assets/, api.js, README, CHANGELOG, LICENSE)
# and attaches module.json + module.zip to the release.
#
# Foundry's update link is releases/latest/download/module.json, and GitHub's "latest" skips
# prereleases, so a full release tagged "manifest" always carries the newest module.json: installed
# copies find every update, prerelease or not.
#
# A published full release (not a prerelease) is then sent to Foundry's package release API. Foundry
# revokes the key when a package publishes too often, so Foundry hears about at most one release per
# 24 hours: a later release in that window stays on GitHub (its update link still works) and the
# publish job stops with an error. "Run workflow" (Publish to Foundry) sends an existing release to
# Foundry by hand once the window has passed. Release notes containing <!-- no-foundry --> keep that
# release on GitHub only.
name: Dicer Release Pipeline

env:
  project_url: 'https://github.com/${{github.repository}}'
  latest_manifest_url: 'https://github.com/${{github.repository}}/releases/latest/download/module.json'
  release_module_url: 'https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/module.zip'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to Foundry (for example v1.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Ask Foundry to validate only, without publishing'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The "manifest" release only holds the update link; it is never built.
    # A manual run only publishes an existing release to Foundry.
    if: github.event_name != 'workflow_dispatch' && (github.event_name != 'release' || github.event.release.tag_name != 'manifest')
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Validate Module Manifest
        run: |
          jq empty module.json
          jq -e '.id == "dicer" and (.esmodules | length > 0)' module.json > /dev/null
          echo "Manifest is valid JSON with entry points"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # A few unit tests time things (e.g. the physics worker's first chunk); shared runners are
      # slower and noisier than a desktop, so a failure gets two more tries before it counts.
      - name: Unit Tests
        run: npx vitest run --retry=2

      - name: Build
        run: npm run build

      - name: Extract Version From Tag
        id: get_version
        if: github.event_name == 'release'
        uses: battila7/get-version-action@v2

      - name: Check Tag Matches Manifest Version
        if: github.event_name == 'release'
        run: |
          manifest=$(jq -r .version module.json)
          tag='${{ steps.get_version.outputs.version-without-v }}'
          if [ "$manifest" != "$tag" ]; then echo "module.json version $manifest does not match tag $tag"; exit 1; fi

      - name: Modify Module Manifest With Release-Specific Values
        if: github.event_name == 'release'
        uses: cschleiden/replace-tokens@v1
        with:
          files: 'module.json'
        env:
          URL: ${{ env.project_url }}
          MANIFEST: ${{ env.latest_manifest_url }}
          DOWNLOAD: ${{ env.release_module_url }}

      - name: Create Module Archive
        if: github.event_name == 'release'
        run: |
          zip -r ./module.zip module.json dist styles lang templates assets api.js README.md CHANGELOG.md LICENSE
          unzip -l module.zip | tail -1

      - name: Update Release With Files
        if: github.event_name == 'release'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./module.zip'
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}

      - name: Point The Update Link At This Version
        if: github.event_name == 'release' && github.event.release.draft != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: "Not a version: this release only carries the newest module.json so Foundry's update link (releases/latest/download/module.json) always works. Pick a real version below."
        run: |
          if gh release view manifest >/dev/null 2>&1; then
            gh release upload manifest module.json --clobber
            gh release edit manifest --latest --prerelease=false
          else
            gh release create manifest module.json --title "Update link (latest manifest)" --notes "$NOTES" --latest --target "${{ github.sha }}"
          fi
          echo "Update link now serves $(jq -r .version module.json)"

  publish-to-foundry:
    runs-on: ubuntu-latest
    needs: [build]
    # After a published (non-pre)release's build, or by hand (the build is skipped then). A release whose
    # notes contain <!-- no-foundry --> (an HTML comment, invisible on GitHub) stays on GitHub only.
    if: ${{ always() && ((github.event_name == 'release' && github.event.release.prerelease != true && github.event.release.tag_name != 'manifest' && !contains(github.event.release.body, '<!-- no-foundry -->') && needs.build.result == 'success') || github.event_name == 'workflow_dispatch') }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      - name: Check The Release Exists
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx module.json \
            || { echo "::error::Release $TAG has no module.json asset; publish it on GitHub first."; exit 1; }

      # Foundry revokes the API key when a package publishes too often: at most one release per 24 hours.
      - name: Allow One Foundry Release Per 24 Hours
        run: |
          since=$(date -u -d '24 hours ago' +%s)
          gh api "repos/${{ github.repository }}/actions/workflows/main.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | "\(.id) \(.created_at)"' |
          while read -r id created; do
            [ "$(date -u -d "$created" +%s)" -lt "$since" ] && continue
            published=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.name == "publish-to-foundry" and .conclusion == "success")] | length')
            if [ "$published" -gt 0 ]; then
              echo "::error::Foundry already received a release from run $id at $created (within 24 hours). $TAG stays on GitHub only; its update link works. Publish it later with Run workflow → Publish to Foundry."
              exit 1
            fi
          done

      - name: Publish to Foundry VTT
        uses: JamesIves/fetch-api-data-action@v2
        with:
          endpoint: https://foundryvtt.com/_api/packages/release_version/
          configuration: '{ "method": "POST", "headers": { "Content-Type": "application/json", "Authorization": "${{ secrets.FVTT_API_TOKEN }}" }, "body": { "id": "dicer", "dry-run": ${{ env.DRY_RUN }}, "release": { "version": "${{ env.TAG }}", "manifest": "https://github.com/${{github.repository}}/releases/download/${{ env.TAG }}/module.json", "notes": "https://github.com/${{github.repository}}/blob/main/CHANGELOG.md", "compatibility": { "minimum": "14", "verified": "14", "maximum": "" } } } }'
