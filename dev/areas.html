<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dicer roll areas review</title>
    <link rel="stylesheet" href="/styles/dicer.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2b2f36;
        color: #e8e8e8;
        font:
          13px system-ui,
          sans-serif;
        overflow: hidden;
      }
      #panel {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        width: 300px;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 8px 12px 16px;
        background: rgba(0, 0, 0, 0.55);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      h2 {
        margin: 12px 0 4px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #a8aebb;
      }
      label {
        display: block;
        margin: 2px 0;
      }
      button,
      select,
      input {
        font: inherit;
      }
      button {
        padding: 3px 8px;
        cursor: pointer;
      }
      input[type='number'] {
        width: 56px;
      }
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
      }
      .rect {
        position: absolute;
        box-sizing: border-box;
        border: 2px dashed;
        font-size: 11px;
        padding: 2px 4px;
      }
      #status {
        margin-top: 8px;
        color: #a8aebb;
        white-space: pre-wrap;
      }
      #status.bad {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <div id="overlay"></div>
    <div id="panel">
      <h1>Dicer roll areas review</h1>
      <p>
        The fake usable region is the dashed white box (the whole window right of this panel,
        inset 24 px). Each coloured box is an area resolved by <code>resolveArea</code>.
      </p>
      <h2>Show</h2>
      <label><input type="checkbox" data-show="full" checked /> full</label>
      <label><input type="checkbox" data-show="centre" checked /> centre</label>
      <label><input type="checkbox" data-show="bottom" checked /> bottom</label>
      <label><input type="checkbox" data-show="corner" checked /> corner</label>
      <label><input type="checkbox" data-show="custom" checked /> custom</label>
      <h2>Custom (fractions)</h2>
      <div>
        x <input id="cx" type="number" step="0.05" value="0.05" /> y
        <input id="cy" type="number" step="0.05" value="0.1" />
      </div>
      <div>
        w <input id="cw" type="number" step="0.05" value="0.3" /> h
        <input id="ch" type="number" step="0.05" value="0.25" />
      </div>
      <label>
        Area scale
        <input id="scale" type="range" min="0.5" max="1.5" step="0.05" value="1" />
      </label>
      <h2>Throw</h2>
      <div>
        A:
        <select id="areaA"></select>
      </div>
      <div>
        B:
        <select id="areaB"></select>
      </div>
      <button id="both">Throw A and B together</button>
      <div id="status">loading...</div>
    </div>
    <script type="module" src="./areas.js"></script>
  </body>
</html>
