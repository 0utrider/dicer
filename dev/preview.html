<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dicer preview</title>
    <link rel="stylesheet" href="/styles/dicer.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2b2f36;
        color: #e8e8e8;
        font:
          14px system-ui,
          sans-serif;
        overflow: hidden;
      }
      #bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.45);
      }
      button {
        padding: 4px 12px;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #b3202a;
        color: #fff;
      }
      #results {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 100;
        margin: 0;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.45);
        font:
          13px ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
      .bad {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <strong>Dicer preview</strong>
      <span id="bodies"></span>
      <button id="throw" type="button" disabled>Throw</button>
      <span id="status">loading...</span>
    </div>
    <pre id="results"></pre>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
