<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dicer effects review</title>
    <link rel="stylesheet" href="/styles/dicer.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2b2f36;
        color: #e8e8e8;
        font:
          13px system-ui,
          sans-serif;
        overflow: hidden;
      }
      #panel {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        width: 340px;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 8px 12px 16px;
        background: rgba(0, 0, 0, 0.55);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      h2 {
        margin: 12px 0 4px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #a8aebb;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      button,
      select {
        padding: 3px 8px;
        font: inherit;
        cursor: pointer;
      }
      #status {
        margin-top: 8px;
        color: #a8aebb;
        white-space: pre-wrap;
      }
      #status.bad {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>Dicer effects review</h1>
      <label>
        Tier
        <select id="tier"></select>
      </label>
      <button id="plain">Roll a d20</button>
      <h2>Effects (on a landed 20)</h2>
      <div class="row" id="effects"></div>
      <h2>Damage themes (look + landing)</h2>
      <div class="row" id="themes"></div>
      <h2>Result sounds</h2>
      <div class="row" id="results"></div>
      <h2>Impacts: material / surface</h2>
      <div class="row" id="impacts"></div>
      <div id="status">loading...</div>
    </div>
    <script type="module" src="./effects.js"></script>
  </body>
</html>
